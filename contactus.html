<!DOCTYPE html>
<html>

<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="csscontactus.css">
</head>

<body>
<div class="layer">
<form method="post">
    <h1 class="header">Contact with us!</h1>
<input class="inputs" placeholder="Enter Name" maxlength="20" pattern="[a-z,A-Z] {2,20}" required>
<input class="inputs" placeholder="Enter Last Name" required maxlength="20"> <br>
<input class="inputs" placeholder="Enter Valid Email Adress" type="email" required>
<input class="inputs" placeholder="mm/dd/yy" required pattern="date"> <br>
<textarea class="message" placeholder="Your message" type="text" required maxlength="600"></textarea> <br>
<input class="send"  type="submit" value="Send!">

    
</form>
</div>
</body>

</html>
